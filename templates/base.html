<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibraryMS v0.1</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        nav { background: #333; padding: 12px; border-radius: 5px; margin-bottom: 20px; }
        nav a { color: white; margin-right: 15px; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .categories { margin-bottom: 15px; background: #e9ecef; padding: 10px; border-radius: 5px; }
        .categories a { display: inline-block; margin: 3px; padding: 6px 12px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; font-size: 14px; }
        .categories a.active { background: #28a745; }
        .error-msg { color: #dc3545; font-weight: bold; font-size: 18px; }
        .badge-success { color: green; font-weight: bold; }
        .badge-danger { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Menu chung -->
        <nav>
            <a href="{{ url_for('home') }}">Trang chủ</a>
            <a href="{{ url_for('get_books') }}">Danh sách sách</a>
        </nav>

        <!-- Nội dung thay đổi từng trang -->
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
